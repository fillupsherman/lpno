<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leftist-Progressive Night Out!</title>
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/plasma.css?v=20260919-readable">
  </head>
  <body>
    <header id="site-header"></header>
    <main class="wrap">
      <div class="toolbar">
        <div class="search" role="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="q" placeholder="Search by name or description…" aria-label="Search events" />
        </div>
        <button id="refresh" class="btn" type="button" title="Refresh">Refresh</button>
      </div>
      <div id="events" class="grid" aria-live="polite" aria-busy="true"></div>
      <p id="msg" class="empty" hidden></p>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <footer id="site-footer"></footer>

    <script type="module">
      import { API, showToast } from '/js/utils.js';
      import { initHeader, initFooter } from '/js/components.js';
      initHeader(); initFooter();
      const els = {
        list: document.getElementById('events'),
        search: document.getElementById('q'),
        refresh: document.getElementById('refresh'),
        msg: document.getElementById('msg')
      };
      const fmtDate = new Intl.DateTimeFormat(navigator.language || 'en-US', { dateStyle: 'medium', timeStyle: 'short' });
      const relTime = new Intl.RelativeTimeFormat(navigator.language || 'en-US', { numeric: 'auto' });
      const escapeHTML = (s='') => s
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'",'&#39;');

      function whenRelative(iso){
        const diff = new Date(iso).getTime() - Date.now();
        const mins = Math.round(diff / 60000);
        if (Math.abs(mins) < 60) return relTime.format(mins, 'minute');
        const hrs = Math.round(mins / 60);
        if (Math.abs(hrs) < 24) return relTime.format(hrs, 'hour');
        return relTime.format(Math.round(hrs / 24), 'day');
      }
      function skeleton(n=6){
        els.list.setAttribute('aria-busy','true');
        els.list.innerHTML = Array.from({length:n}).map(()=>'<div class="skeleton"></div>').join('');
        els.msg.hidden = true;
      }
      function render(events) {
        els.list.removeAttribute('aria-busy');
        if (!Array.isArray(events) || events.length === 0){
          els.list.innerHTML = '';
          els.msg.hidden = false; els.msg.textContent = 'No upcoming events yet.';
          return;
        }
        const q = els.search.value.trim().toLowerCase();
        const filtered = q ? events.filter(e => (e.name + ' ' + (e.description || '')).toLowerCase().includes(q)) : events;
        if (filtered.length === 0){
          els.list.innerHTML = '';
          els.msg.hidden = false; els.msg.textContent = 'No matches for your search.';
          return;
        }
        els.msg.hidden = true;
        const frag = document.createDocumentFragment();
        filtered.forEach(ev => {
          const card = document.createElement('article');
          card.className = 'card';
          card.setAttribute('data-id', ev.id);
          card.tabIndex = 0;
          const media = document.createElement('div');
          media.className = 'media';
          if (ev.image_url){
            const img = document.createElement('img');
            img.src = ev.image_url; img.alt = `${ev.name} banner`; img.loading = 'lazy'; img.decoding = 'async';
            media.appendChild(img);
          }
          const chip = document.createElement('div');
          chip.className = 'datechip'; chip.textContent = whenRelative(ev.time);
          media.appendChild(chip); card.appendChild(media);
          const content = document.createElement('div');
          content.className = 'content';
          const mapUrl = `https://www.google.com/maps/search/?api=1&query=${ev.lat},${ev.lon}`;
          const attendeeCount = Number(ev.total_rsvps || 0).toLocaleString();
          content.innerHTML = `
            <div class="eyebrow">${fmtDate.format(new Date(ev.time))}</div>
            <div class="location"><a class="gradient-underline" href="${mapUrl}" target="_blank" rel="noopener">${escapeHTML(ev.location_name || 'Location TBD')}</a></div>
            <div class="location"><a class="gradient-underline" href="${mapUrl}" target="_blank" rel="noopener">${escapeHTML(ev.location_city || 'Location TBD')}</a></div>
            <h2 class="name">${escapeHTML(ev.name || 'Untitled')}</h2>
            <p class="desc">${escapeHTML(ev.description || 'No description yet.')}</p>
            ${ev.description && ev.description.length > 180 ? '<button class="toggle-desc">Read more</button>' : ''}
            <div class="stats" aria-label="RSVP counts">
              <span><strong>${attendeeCount}</strong> RSVPs</span>
              <span>• Meetup: ${Number(ev.meetup_rsvps || 0).toLocaleString()}</span>
              <span>• Site: ${Number(ev.local_rsvps || 0).toLocaleString()}</span>
            </div>
            <div class="names" aria-label="Attendance" style="background:#080b12 !important; border:4px solid #fff !important; border-radius:14px; box-shadow:0 0 0 4px #ef4444, 0 0 0 8px #3b82f6; padding:14px 12px; margin:12px 0 0;">
              <strong class="attendance-heading" style="display:block; width:100%; margin:0; padding:8px 4px; font-family:Impact, Haettenschweiler, 'Arial Black', sans-serif; font-size:clamp(1.35rem, 4vw, 3rem); line-height:1.05; letter-spacing:.08em; text-transform:uppercase; text-align:center; font-weight:900; color:#fff !important; background:none !important; -webkit-text-fill-color:#fff !important; -webkit-text-stroke:2px #000; text-shadow:3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000; filter:none;">${attendeeCount} REBEL SCUM ATTENDING</strong>
            </div>
          `;
          card.appendChild(content);
          const form = document.createElement('div');
          form.className = 'form';
          form.innerHTML = ev.total_rsvps >= 20
            ? '<span><strong>This event is full.</strong></span>'
            : '<input name="name" placeholder="Your name" aria-label="Your name" /><button type="button" class="btn">RSVP</button>';
          const btn = form.querySelector('button');
          if (btn) btn.addEventListener('click', e => {
            e.preventDefault(); e.stopPropagation();
            try { showToast('RSVP is disabled.', false); } catch (err) {}
          });
          card.appendChild(form); frag.appendChild(card);
        });
        els.list.innerHTML = ''; els.list.appendChild(frag);
        document.querySelectorAll('.toggle-desc').forEach(btn => btn.addEventListener('click', () => {
          const desc = btn.previousElementSibling;
          desc.classList.toggle('expanded');
          btn.textContent = desc.classList.contains('expanded') ? 'Show less' : 'Read more';
        }));
        const obs = new IntersectionObserver(entries => entries.forEach(en => {
          if (en.isIntersecting){
            en.target.animate([{transform:'translateY(8px)', opacity:.001}, {transform:'translateY(0)', opacity:1}], {duration:260, easing:'cubic-bezier(.2,.8,.2,1)'});
            obs.unobserve(en.target);
          }
        }), {rootMargin:'0px 0px -10% 0px'});
        document.querySelectorAll('.card').forEach(el => obs.observe(el));
      }
      async function load(){
        skeleton();
        try{
          const res = await fetch(`${API}/events`, { headers:{'Accept':'application/json'} });
          const events = await res.json();
          if (!Array.isArray(events)) throw new Error(events && (events.error || JSON.stringify(events)) || 'Invalid response');
          events.sort((a,b) => new Date(a.time) - new Date(b.time)); render(events);
        } catch(err) {
          console.error(err); els.list.innerHTML = ''; els.msg.hidden = false;
          els.msg.innerHTML = `<span class="error">Error loading events.</span> <small>${escapeHTML(String(err.message || err))}</small>`;
        }
      }
      els.refresh.addEventListener('click', load); load();
    </script>
  </body>
</html>
