<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Philadelphia — Coming Soon</title>
  <link rel="stylesheet" href="/css/site.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .coming-soon {
      text-align: center;
      max-width: 600px;
    }

    .coming-soon h1 {
      font-size: clamp(24px, 5vw, 48px);
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #ef4444, #ffffff, #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .coming-soon p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 2rem;
      color: var(--text);
    }

    .coming-soon a {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .coming-soon a:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <div class="coming-soon">
    <h1>Philadelphia Chapter</h1>
    <p>We're building something special for the Philadelphia community. Stay tuned!</p>
    <a href="/">← Back to Events</a>
  </div>
</body>
</html>
